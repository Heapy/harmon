product:
  type: kmp/lib
  platforms: [macosArm64]

apply: [../harmon.module-template.yaml]

plugins:
  # Generates the database API owned by this module from sqldelight/*.sq.
  sqldelight-gen: enabled

dependencies:
  - ../core
  # Unlike the project's own bridge cinterops, this third-party klib is available to this
  # module's test compilation, so storage tests exercise real SQLite files.
  - $libs.sqldelight.native.driver

settings:
  kotlin:
    # The bridge spike proved that linkerOpts declared by a .def cross module boundaries.
    # This is different: freeCompilerArgs is a per-module compiler setting. Keep it here for
    # this module's test executable; harmon repeats it for its own final application link.
    freeCompilerArgs: [-linker-option, -lsqlite3]
