product:
  type: kmp/lib
  platforms: [macosArm64]

apply: [../harmon.module-template.yaml]

plugins:
  sqldelight-gen: enabled

dependencies:
  - ../core
  # Unlike project cinterops, this third-party klib is reachable from the test compilation.
  - $libs.sqldelight.native.driver

settings:
  kotlin:
    # freeCompilerArgs is module-local; this links the module's test executable.
    freeCompilerArgs: [-linker-option, -lsqlite3]
