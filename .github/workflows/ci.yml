name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The project targets macosArm64 only and builds with the committed ./kotlin
# wrapper (JetBrains Kotlin Toolchain, not Gradle), so CI runs on Apple-silicon
# macOS runners. The suite is pure Kotlin/Native: the test binary does not link
# the cinterop klib, so nothing here exercises the native bridge.
jobs:
  build-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Cache the Kotlin toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin/cli
            ~/.konan
            ~/.kotlin
            .kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'module.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      - name: Build
        run: ./kotlin build

      - name: Test
        run: ./kotlin test
