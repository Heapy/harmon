name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# macos-26 supplies an SDK declaring vm_statistics64.swapped_count for cinterop.
jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Cache the Kotlin toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin/cli
            ~/.konan
            ~/.kotlin
            .kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'module.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-1.62.0-${{ runner.os }}-${{ runner.arch }}

      - name: Build
        run: ./kotlin build

      - name: Test
        run: ./kotlin test
