name: Release

on:
  push:
    tags: ['v*']

# Keep the version-matched agent and collector in one archive.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Cache the Kotlin toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin/cli
            ~/.konan
            ~/.kotlin
            .kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'module.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      - name: Build and package paired release
        id: package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tarball="dist/harmon-${version}-macos-arm64.tar.gz"
          scripts/package-release.sh --output-dir dist --tag "$GITHUB_REF_NAME"
          {
            echo "tarball=$tarball"
            echo "checksum=$tarball.sha256"
            echo "provenance=$tarball.provenance.json"
            echo "formula=dist/Formula/harmon.rb"
          } >> "$GITHUB_OUTPUT"

      - name: Attest paired release provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.tarball }}

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.package.outputs.provenance }}
            ${{ steps.package.outputs.formula }}
