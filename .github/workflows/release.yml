name: Release

on:
  push:
    tags: ['v*']

# On a v* tag, build and publish one paired macosArm64 archive. Keeping the
# agent and collector in one asset makes a mixed source pair impossible.
#
# The image is pinned to macos-26 for its SDK: cinterop reads
# `vm_statistics64.swapped_count`, which the macOS 14 SDK does not declare.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Cache the Kotlin toolchain
        uses: actions/cache@v6
        with:
          # The wrapper puts the CLI distribution under Library/Caches on macOS,
          # and the Kotlin/Native compiler pulls its own prebuilt into ~/.konan.
          path: |
            ~/Library/Caches/JetBrains/Kotlin/cli
            ~/.konan
            ~/.kotlin
            .kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'module.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      - name: Build and package paired release
        id: package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tarball="dist/harmon-${version}-macos-arm64.tar.gz"
          scripts/package-release.sh --output-dir dist --tag "$GITHUB_REF_NAME"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "checksum=$tarball.sha256" >> "$GITHUB_OUTPUT"
          echo "provenance=$tarball.provenance.json" >> "$GITHUB_OUTPUT"
          echo "formula=dist/Formula/harmon.rb" >> "$GITHUB_OUTPUT"

      - name: Attest paired release provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.tarball }}

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.package.outputs.provenance }}
            ${{ steps.package.outputs.formula }}
