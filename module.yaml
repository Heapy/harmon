product:
  type: macos/app
  platforms: [macosArm64]

apply: [./harmon.module-template.yaml]

dependencies:
  - ./core
  - ./history-sqlite
  - ./bridge-ipc
  - ./bridge-http
  - ./bridge-install

settings:
  kotlin:
    # The bridge spike proved that linkerOpts declared by a .def cross module boundaries.
    # This is different: freeCompilerArgs is a per-module compiler setting, so the copy in
    # history-sqlite does not reach this final application link.
    freeCompilerArgs: [-linker-option, -lsqlite3]
