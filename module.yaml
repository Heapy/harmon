product:
  type: macos/app
  platforms: [macosArm64]

apply: [./harmon.module-template.yaml]

dependencies:
  - ./core
  - ./history-sqlite
  - ./bridge-ipc
  - ./bridge-http
  - ./bridge-install

settings:
  kotlin:
    # freeCompilerArgs is module-local; history-sqlite's copy cannot reach this app link.
    freeCompilerArgs: [-linker-option, -lsqlite3]
