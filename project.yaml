# The root module `harmon` is included implicitly; only the extra modules are
# listed here.
modules:
  - ./nativebridge
  # The build-time codegen plugin is also a normal module and must be listed here.
  - ./plugins/sqldelight-gen
  - ./selftest

plugins:
  # Register the SQLDelight codegen plugin so the root module can enable it.
  - ./plugins/sqldelight-gen
